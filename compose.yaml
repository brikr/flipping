# For trying the image locally (docker compose up --build). The NAS doesn't use
# this file; it pulls the CI-built image via deploy/synology/compose.yaml.
services:
  flipping:
    build: .
    image: flipping:dev
    ports:
      - "8000:8000"
    environment:
      FLIPPING_BACKFILL_STEP: 1h
    volumes:
      - flipping-data:/data

volumes:
  flipping-data:
